<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>우리반 대화방</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #B2C7D9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 800px;
      background: #B2C7D9;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
    }
    
    /* 화면 전환 */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    .screen.active {
      display: flex;
      flex-direction: column;
    }
    
    /* ===== 로그인 화면 ===== */
    .login-screen {
      background: linear-gradient(180deg, #FEE500 0%, #FDD835 100%);
      justify-content: center;
      align-items: center;
      padding: 40px 30px;
    }
    
    .login-logo {
      width: 100px;
      height: 100px;
      background: #3C1E1E;
      border-radius: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    
    .login-logo-text {
      color: #FEE500;
      font-size: 28px;
      font-weight: 700;
    }
    
    .login-title {
      font-size: 24px;
      font-weight: 700;
      color: #3C1E1E;
      margin-bottom: 8px;
    }
    
    .login-subtitle {
      font-size: 14px;
      color: #5C4033;
      margin-bottom: 40px;
    }
    
    .login-form {
      width: 100%;
      max-width: 300px;
    }
    
    .input-group {
      margin-bottom: 12px;
    }
    
    .input-group input {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-size: 15px;
      background: rgba(255,255,255,0.9);
      outline: none;
      transition: all 0.2s;
    }
    
    .input-group input:focus {
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .input-group input::placeholder {
      color: #999;
    }
    
    .btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
    }
    
    .btn-primary {
      background: #3C1E1E;
      color: #FEE500;
    }
    
    .btn-primary:hover {
      background: #2C0E0E;
    }
    
    .btn-secondary {
      background: rgba(255,255,255,0.5);
      color: #3C1E1E;
    }
    
    .btn-secondary:hover {
      background: rgba(255,255,255,0.8);
    }
    
    .login-message {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
    }
    
    .login-message.error {
      color: #D32F2F;
    }
    
    .login-message.success {
      color: #388E3C;
    }
    
    /* ===== 대화방 목록 화면 ===== */
    .room-list-screen {
      background: #FEE500;
    }
    
    .header {
      height: 56px;
      background: #FEE500;
      display: flex;
      align-items: center;
      padding: 0 16px;
      position: relative;
    }
    
    .header-title {
      flex: 1;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: #3C1E1E;
    }
    
    .header-btn {
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3C1E1E;
    }
    
    .user-info {
      background: #FDD835;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .user-avatar {
      width: 50px;
      height: 50px;
      background: #3C1E1E;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FEE500;
      font-weight: 700;
      font-size: 20px;
    }
    
    .user-name {
      font-size: 16px;
      font-weight: 600;
      color: #3C1E1E;
    }
    
    .room-list {
      flex: 1;
      background: #fff;
      overflow-y: auto;
      border-radius: 24px 24px 0 0;
    }
    
    .room-list-title {
      padding: 20px 20px 12px;
      font-size: 14px;
      color: #999;
      font-weight: 500;
    }
    
    .room-item {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .room-item:hover {
      background: #f8f8f8;
    }
    
    .room-item:active {
      background: #f0f0f0;
    }
    
    .room-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-right: 14px;
      color: #fff;
      font-weight: 700;
    }
    
    .room-icon.room-1 { background: linear-gradient(135deg, #FF6B6B, #FF8E8E); }
    .room-icon.room-2 { background: linear-gradient(135deg, #4ECDC4, #6EE7DE); }
    .room-icon.room-3 { background: linear-gradient(135deg, #A18CD1, #BC9FE2); }
    .room-icon.room-4 { background: linear-gradient(135deg, #FAD961, #F7CE68); }
    .room-icon.room-5 { background: linear-gradient(135deg, #74B9FF, #81C2FF); }
    
    .room-info {
      flex: 1;
      min-width: 0;
    }
    
    .room-name {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }
    
    .room-preview {
      font-size: 13px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .room-meta {
      text-align: right;
      margin-left: 10px;
    }
    
    .room-time {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 6px;
    }
    
    .room-count {
      background: #FF5252;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      display: inline-block;
    }
    
    /* ===== 채팅 화면 ===== */
    .chat-screen {
      background: #B2C7D9;
    }
    
    .chat-header {
      height: 56px;
      background: #B2C7D9;
      display: flex;
      align-items: center;
      padding: 0 8px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    
    .back-btn {
      width: 44px;
      height: 44px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    
    .chat-header-title {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      color: #333;
    }
    
    .chat-header-count {
      font-size: 13px;
      color: #666;
      margin-right: 12px;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .message-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    
    .message-wrapper.mine {
      flex-direction: row-reverse;
    }
    
    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      flex-shrink: 0;
      align-self: flex-start;
    }
    
    .message-wrapper.mine .message-avatar {
      display: none;
    }
    
    .message-content {
      max-width: 70%;
      display: flex;
      flex-direction: column;
    }
    
    .message-wrapper.mine .message-content {
      align-items: flex-end;
    }
    
    .message-sender {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
      margin-left: 4px;
    }
    
    .message-wrapper.mine .message-sender {
      display: none;
    }
    
    .message-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    
    .message-wrapper.mine .message-bubble {
      background: #FEE500;
      color: #333;
      border-bottom-right-radius: 4px;
    }
    
    .message-wrapper.other .message-bubble {
      background: #fff;
      color: #333;
      border-bottom-left-radius: 4px;
    }
    
    .message-time {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
      padding: 0 4px;
    }
    
    /* ===== 채팅 입력 영역 ===== */
    .chat-input-container {
      background: #fff;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #e5e5e5;
      position: relative;
    }
    
    .emoji-btn {
      width: 36px;
      height: 36px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    
    .emoji-btn:hover {
      transform: scale(1.1);
    }
    
    .chat-input {
      flex: 1;
      height: 40px;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      padding: 0 16px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .chat-input:focus {
      border-color: #FEE500;
    }
    
    .send-btn {
      width: 40px;
      height: 40px;
      background: #FEE500;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .send-btn:hover {
      background: #FDD835;
      transform: scale(1.05);
    }
    
    .send-btn:active {
      transform: scale(0.95);
    }
    
    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: #3C1E1E;
    }
    
    /* ===== 이모티콘 패널 ===== */
    .emoji-panel {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #e5e5e5;
      display: none;
      flex-direction: column;
      max-height: 280px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    }
    
    .emoji-panel.active {
      display: flex;
    }
    
    .emoji-tabs {
      display: flex;
      border-bottom: 1px solid #f0f0f0;
      background: #fafafa;
    }
    
    .emoji-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 20px;
      cursor: pointer;
      border: none;
      background: none;
      transition: background 0.2s;
    }
    
    .emoji-tab:hover {
      background: #f0f0f0;
    }
    
    .emoji-tab.active {
      background: #FEE500;
    }
    
    .emoji-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
    }
    
    .emoji-item {
      width: 100%;
      aspect-ratio: 1;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s, transform 0.1s;
      border: none;
      background: none;
    }
    
    .emoji-item:hover {
      background: #f5f5f5;
      transform: scale(1.15);
    }
    
    .emoji-item:active {
      transform: scale(0.95);
    }
    
    .emoji-category {
      display: none;
    }
    
    .emoji-category.active {
      display: grid;
    }
    
    /* 날짜 구분선 */
    .date-divider {
      text-align: center;
      padding: 16px 0;
    }
    
    .date-divider span {
      background: rgba(0,0,0,0.1);
      color: #666;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 14px;
    }
    
    /* 로딩 오버레이 */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    .loading-overlay.active {
      display: flex;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f0f0f0;
      border-top-color: #FEE500;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* 스크롤바 스타일 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.15);
      border-radius: 3px;
    }
    
    /* 반응형 */
    @media (max-width: 420px) {
      .app-container {
        max-height: 100vh;
      }
      
      .emoji-grid {
        grid-template-columns: repeat(7, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 로그인 화면 -->
    <div id="loginScreen" class="screen login-screen active">
      <div class="login-logo">
        <span class="login-logo-text">💬</span>
      </div>
      <h1 class="login-title">우리반 대화방</h1>
      <p class="login-subtitle">4학년 국어 온라인 대화 수업</p>
      
      <div class="login-form">
        <div class="input-group">
          <input type="text" id="userName" placeholder="이름 (예: 홍길동)" maxlength="10" autocomplete="off">
        </div>
        <div class="input-group">
          <input type="password" id="userPassword" placeholder="비밀번호 (2~10자)" maxlength="10" autocomplete="off">
        </div>
        <button class="btn btn-primary" id="loginBtn" onclick="login()">로그인</button>
        <button class="btn btn-secondary" id="registerBtn" onclick="register()">회원가입</button>
        <div id="loginMessage" class="login-message"></div>
      </div>
    </div>
    
    <!-- 대화방 목록 화면 -->
    <div id="roomListScreen" class="screen room-list-screen">
      <div class="header">
        <button class="header-btn" onclick="logout()">🚪</button>
        <span class="header-title">채팅</span>
        <div style="width:40px;"></div>
      </div>
      
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">나</div>
        <div>
          <div class="user-name" id="displayUserName">사용자</div>
        </div>
      </div>
      
      <div class="room-list">
        <div class="room-list-title">대화방 목록</div>
        <div id="roomListContainer"></div>
      </div>
    </div>
    
    <!-- 채팅 화면 -->
    <div id="chatScreen" class="screen chat-screen">
      <div class="chat-header">
        <button class="back-btn" onclick="exitRoom()">←</button>
        <span class="chat-header-title" id="chatRoomTitle">대화방</span>
        <span class="chat-header-count" id="chatMemberCount"></span>
      </div>
      
      <div class="chat-messages" id="chatMessages">
        <div class="date-divider"><span>오늘</span></div>
      </div>
      
      <div class="chat-input-container">
        <!-- 이모티콘 패널 -->
        <div class="emoji-panel" id="emojiPanel">
          <div class="emoji-tabs">
            <button class="emoji-tab active" data-category="face" onclick="switchEmojiTab('face')">😊</button>
            <button class="emoji-tab" data-category="gesture" onclick="switchEmojiTab('gesture')">👍</button>
            <button class="emoji-tab" data-category="animal" onclick="switchEmojiTab('animal')">🐶</button>
            <button class="emoji-tab" data-category="food" onclick="switchEmojiTab('food')">🍕</button>
            <button class="emoji-tab" data-category="activity" onclick="switchEmojiTab('activity')">⚽</button>
            <button class="emoji-tab" data-category="heart" onclick="switchEmojiTab('heart')">❤️</button>
            <button class="emoji-tab" data-category="object" onclick="switchEmojiTab('object')">🎁</button>
          </div>
          <div class="emoji-content">
            <!-- 표정 -->
            <div class="emoji-grid emoji-category active" id="emoji-face"></div>
            <!-- 손동작 -->
            <div class="emoji-grid emoji-category" id="emoji-gesture"></div>
            <!-- 동물 -->
            <div class="emoji-grid emoji-category" id="emoji-animal"></div>
            <!-- 음식 -->
            <div class="emoji-grid emoji-category" id="emoji-food"></div>
            <!-- 활동 -->
            <div class="emoji-grid emoji-category" id="emoji-activity"></div>
            <!-- 하트 -->
            <div class="emoji-grid emoji-category" id="emoji-heart"></div>
            <!-- 사물 -->
            <div class="emoji-grid emoji-category" id="emoji-object"></div>
          </div>
        </div>
        
        <button class="emoji-btn" id="emojiBtn" onclick="toggleEmojiPanel()">😊</button>
        <input type="text" class="chat-input" id="messageInput" placeholder="메시지를 입력하세요" maxlength="500" autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
    
    <!-- 로딩 오버레이 -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    // ===== 이모티콘 데이터 =====
    var emojiData = {

    // ===== 전역 변수 =====
    var currentUser = null;
    var currentRoom = null;

    // ===== 유틸리티 함수 =====
    function showScreen(screenId) {
      var screens = document.querySelectorAll('.screen');
      for (var i = 0; i < screens.length; i++) {
        screens[i].classList.remove('active');
      }
      document.getElementById(screenId).classList.add('active');
    }
    
    function showLoading() {
      document.getElementById('loadingOverlay').classList.add('active');
    }
    
    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }
    
    function showMessage(elementId, message, isError) {
      var el = document.getElementById(elementId);
      el.textContent = message;
      el.className = 'login-message ' + (isError ? 'error' : 'success');
    }
    
    function escapeHtml(text) {
      if (!text) return '';
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function getCurrentTime() {
      var now = new Date();
      var hours = now.getHours();
      var minutes = now.getMinutes();
      if (hours < 10) hours = '0' + hours;
      if (minutes < 10) minutes = '0' + minutes;
      return hours + ':' + minutes;
    }
    
    // ===== 이모티콘 함수 =====
    function initEmojiPanel() {
      var categories = Object.keys(emojiData);
      for (var c = 0; c < categories.length; c++) {
        var category = categories[c];
        var container = document.getElementById('emoji-' + category);
        if (!container) continue;
        
        var emojis = emojiData[category];
        container.innerHTML = '';
        
        for (var i = 0; i < emojis.length; i++) {
          var btn = document.createElement('button');
          btn.className = 'emoji-item';
          btn.textContent = emojis[i];
          btn.setAttribute('data-emoji', emojis[i]);
          btn.onclick = (function(emoji) {
            return function() {
              insertEmoji(emoji);
            };
          })(emojis[i]);
          container.appendChild(btn);
        }
      }
    }
    
    function toggleEmojiPanel() {
      var panel = document.getElementById('emojiPanel');
      isEmojiPanelOpen = !isEmojiPanelOpen;
      
      if (isEmojiPanelOpen) {
        panel.classList.add('active');
      } else {
        panel.classList.remove('active');
      }
    }
    
    function switchEmojiTab(category) {
      // 탭 활성화
      var tabs = document.querySelectorAll('.emoji-tab');
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove('active');
        if (tabs[i].getAttribute('data-category') === category) {
          tabs[i].classList.add('active');
        }
      }
      
      // 카테고리 표시
      var categories = document.querySelectorAll('.emoji-category');
      for (var j = 0; j < categories.length; j++) {
        categories[j].classList.remove('active');
      }
      document.getElementById('emoji-' + category).classList.add('active');
    }
    
    function insertEmoji(emoji) {
      var input = document.getElementById('messageInput');
      var start = input.selectionStart;
      var end = input.selectionEnd;
      var text = input.value;
      
      input.value = text.substring(0, start) + emoji + text.substring(end);
      input.focus();
      
      // 커서 위치 조정
      var newPos = start + emoji.length;
      input.setSelectionRange(newPos, newPos);
    }
    
    // ===== 회원가입 =====
    function register() {
      var name = document.getElementById('userName').value.trim();
      var password = document.getElementById('userPassword').value;
      
      if (!name || !password) {
        showMessage('loginMessage', '이름과 비밀번호를 모두 입력해주세요.', true);
        return;
      }
      
      showLoading();
      
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          if (result && result.success) {
            showMessage('loginMessage', result.message, false);
          } else {
            showMessage('loginMessage', result ? result.message : '오류가 발생했습니다.', true);
          }
        })
        .withFailureHandler(function(error) {
          hideLoading();
          showMessage('loginMessage', '오류가 발생했습니다. 다시 시도해주세요.', true);
          console.error('회원가입 오류:', error);
        })
        .registerUser(name, password);
    }
    
    // ===== 로그인 =====
    function login() {
      var name = document.getElementById('userName').value.trim();
      var password = document.getElementById('userPassword').value;
      
      if (!name || !password) {
        showMessage('loginMessage', '이름과 비밀번호를 모두 입력해주세요.', true);
        return;
      }
      
      showLoading();
      
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          if (result && result.success) {
            currentUser = result.userName;
            document.getElementById('displayUserName').textContent = currentUser;
            document.getElementById('userAvatar').textContent = currentUser.charAt(0);
            loadRoomList();
            showScreen('roomListScreen');
          } else {
            showMessage('loginMessage', result ? result.message : '오류가 발생했습니다.', true);
          }
        })
        .withFailureHandler(function(error) {
          hideLoading();
          showMessage('loginMessage', '오류가 발생했습니다. 다시 시도해주세요.', true);
          console.error('로그인 오류:', error);
        })
        .loginUser(name, password);
    }
    
    // ===== 로그아웃 =====
    function logout() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
      currentUser = null;
      currentRoom = null;
      lastTimestamp = 0;
      sentMessages = {};
      document.getElementById('userName').value = '';
      document.getElementById('userPassword').value = '';
      document.getElementById('loginMessage').textContent = '';
      showScreen('loginScreen');
    }
    
    // ===== 대화방 목록 로드 =====
    function loadRoomList() {
      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.success) {
            renderRoomList(result.rooms);
          }
        })
        .withFailureHandler(function(error) {
          console.error('방 목록 로드 실패:', error);
        })
        .getRoomList();
    }
    
    function renderRoomList(rooms) {
      var container = document.getElementById('roomListContainer');
      container.innerHTML = '';
      
      var roomEmojis = ['🍎', '🌈', '⭐', '🌻', '🐬'];
      
      for (var index = 0; index < rooms.length; index++) {
        var room = rooms[index];
        var div = document.createElement('div');
        div.className = 'room-item';
        div.setAttribute('data-room-id', room.id);
        div.setAttribute('data-room-name', room.name);
        div.onclick = (function(roomId, roomName) {
          return function() {
            enterRoom(roomId, roomName);
          };
        })(room.id, room.name);
        
        var preview = room.lastMessage ? room.lastMessage : '대화를 시작해보세요!';
        var timeDisplay = room.lastTime ? room.lastTime : '';
        
        div.innerHTML = 
          '<div class="room-icon room-' + room.id + '">' + roomEmojis[index] + '</div>' +
          '<div class="room-info">' +
            '<div class="room-name">' + escapeHtml(room.name) + '</div>' +
            '<div class="room-preview">' + escapeHtml(preview) + '</div>' +
          '</div>' +
          '<div class="room-meta">' +
            '<div class="room-time">' + timeDisplay + '</div>' +
            (room.count > 0 ? '<span class="room-count">' + room.count + '</span>' : '') +
          '</div>';
        
        container.appendChild(div);
      }
    }
    
    // ===== 대화방 입장 =====
    function enterRoom(roomId, roomName) {
      currentRoom = roomId;
      lastTimestamp = 0;
      sentMessages = {};
      isEmojiPanelOpen = false;
      document.getElementById('emojiPanel').classList.remove('active');
      document.getElementById('chatRoomTitle').textContent = roomName;
      document.getElementById('chatMessages').innerHTML = '<div class="date-divider"><span>오늘</span></div>';
      
      showScreen('chatScreen');
      showLoading();
      
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          if (result && result.success) {
            renderMessages(result.messages);
            lastTimestamp = result.lastTimestamp || 0;
          }
          startPolling();
        })
        .withFailureHandler(function(error) {
          hideLoading();
          console.error('메시지 로드 실패:', error);
          startPolling();
        })
        .getAllMessages(roomId);
      
      setTimeout(function() {
        document.getElementById('messageInput').focus();
      }, 300);
    }
    
    // ===== 대화방 나가기 =====
    function exitRoom() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
      currentRoom = null;
      lastTimestamp = 0;
      sentMessages = {};
      isEmojiPanelOpen = false;
      loadRoomList();
      showScreen('roomListScreen');
    }
    
    // ===== 메시지 렌더링 =====
    function renderMessages(messages) {
      if (!messages || messages.length === 0) return;
      
      var container = document.getElementById('chatMessages');
      
      for (var i = 0; i < messages.length; i++) {
        var msg = messages[i];
        var msgKey = msg.timestamp + '_' + msg.userName + '_' + msg.content;
        
        if (sentMessages[msgKey]) continue;
        sentMessages[msgKey] = true;
        
        var isMine = msg.userName === currentUser;
        
        var wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper ' + (isMine ? 'mine' : 'other');
        
        var html = '';
        
        if (!isMine) {
          html += '<div class="message-avatar">' + escapeHtml(msg.userName.charAt(0)) + '</div>';
        }
        
        html += '<div class="message-content">';
        
        if (!isMine) {
          html += '<div class="message-sender">' + escapeHtml(msg.userName) + '</div>';
        }
        
        html += '<div class="message-bubble">' + escapeHtml(msg.content) + '</div>';
        html += '<div class="message-time">' + escapeHtml(msg.time) + '</div>';
        html += '</div>';
        
        wrapper.innerHTML = html;
        container.appendChild(wrapper);
      }
      
      container.scrollTop = container.scrollHeight;
    }
    
    // ===== 단일 메시지 추가 =====
    function addMyMessage(content, time) {
      var container = document.getElementById('chatMessages');
      
      var wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper mine';
      
      var html = '<div class="message-content">';
      html += '<div class="message-bubble">' + escapeHtml(content) + '</div>';
      html += '<div class="message-time">' + time + '</div>';
      html += '</div>';
      
      wrapper.innerHTML = html;
      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }
    
    // ===== 메시지 전송 =====
    function sendMessage() {
      if (isSending) return;
      
      var input = document.getElementById('messageInput');
      var content = input.value.trim();
      
      if (!content) return;
      if (!currentUser || !currentRoom) return;
      
      isSending = true;
      var sentContent = content;
      var sentTime = getCurrentTime();
      input.value = '';
      
      // 이모티콘 패널 닫기
      isEmojiPanelOpen = false;
      document.getElementById('emojiPanel').classList.remove('active');
      
      addMyMessage(sentContent, sentTime);
      
      var tempKey = Date.now() + '_' + currentUser + '_' + sentContent;
      sentMessages[tempKey] = true;
      
      google.script.run
        .withSuccessHandler(function(result) {
          isSending = false;
          if (result && result.success) {
            if (result.timestamp) {
              var realKey = result.timestamp + '_' + currentUser + '_' + sentContent;
              sentMessages[realKey] = true;
              if (result.timestamp > lastTimestamp) {
                lastTimestamp = result.timestamp;
              }
            }
          } else {
            console.error('메시지 전송 실패:', result ? result.message : '알 수 없는 오류');
          }
        })
        .withFailureHandler(function(error) {
          isSending = false;
          console.error('메시지 전송 오류:', error);
        })
        .sendMessage(currentRoom, currentUser, sentContent);
    }
    
    // ===== 실시간 폴링 (1초) =====
    function startPolling() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
      }
      
      pollingInterval = setInterval(function() {
        if (!currentRoom) return;
        
        google.script.run
          .withSuccessHandler(function(result) {
            if (result && result.success && result.messages && result.messages.length > 0) {
              renderMessages(result.messages);
              if (result.lastTimestamp > lastTimestamp) {
                lastTimestamp = result.lastTimestamp;
              }
            }
          })
          .withFailureHandler(function(error) {
            console.error('폴링 오류:', error);
          })
          .getMessages(currentRoom, lastTimestamp);
      }, 1000);
    }
    
    // ===== 이벤트 리스너 =====
    document.addEventListener('DOMContentLoaded', function() {
      // 이모티콘 패널 초기화
      initEmojiPanel();
      
      document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          sendMessage();
        }
      });
      
      document.getElementById('userPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          login();
        }
      });
      
      // 입력창 클릭 시 이모티콘 패널 닫기
      document.getElementById('messageInput').addEventListener('focus', function() {
        if (isEmojiPanelOpen) {
          isEmojiPanelOpen = false;
          document.getElementById('emojiPanel').classList.remove('active');
        }
      });
    });
  </script>
</body>
</html>
